services:
  # ============================================================================
  # 1. Backend API Service
  # ============================================================================
  - type: web
    name: jansathi-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: jansathi-frontend
          property: host

  # ============================================================================
  # 2. Frontend React Client (Vite Static Site)
  # ============================================================================
  - type: web
    name: jansathi-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jansathi-backend
          property: host
